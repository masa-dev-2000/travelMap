<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#16362d"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><title>記録をはじめる | TravelMap</title><link rel="manifest" href="/manifest.webmanifest">
<style>
:root{--bg:#16362d;--ink:#f3efe6;--muted:#a9c2b8;--ok:#7fe0b5;--warn:#f0b36a;font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden}
body{display:flex;flex-direction:column;gap:12px;height:100dvh;padding:max(12px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
header{flex:none;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}header a{margin-left:auto;color:var(--muted);padding:8px 0}
#where i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--warn);margin-right:6px}#where.ok i{background:var(--ok)}
.way{display:flex;flex-direction:column;justify-content:center;gap:8px;width:100%;padding:22px;border:0;border-radius:32px;color:#fff;font:inherit;text-align:left;text-decoration:none;box-shadow:0 18px 40px -18px #000c,inset 0 2px 0 #ffffff33;transition:transform .08s,filter .2s}
.way:active{transform:scale(.98)}.way strong{font-size:clamp(28px,8vw,44px);font-weight:800;letter-spacing:.02em}.way span{font-size:15px;opacity:.9;line-height:1.5}
#tap{flex:1.4;background:radial-gradient(circle at 30% 30%,#2f7d63,#1f5c4a)}#tap.busy{filter:saturate(.4) brightness(.8)}#tap.done{background:radial-gradient(circle at 30% 30%,#7fe0b5,#2f9d78)}
.detail{flex:1;background:radial-gradient(circle at 30% 30%,#e0a24a,#c77f24)}
footer{flex:none;display:flex;align-items:center;gap:10px;min-height:48px;font-size:14px}
#status{flex:1}#status b{font-size:18px;font-variant-numeric:tabular-nums}
#undo{height:44px;padding:0 16px;border:1px solid #ffffff55;border-radius:14px;background:none;color:var(--ink);font:inherit}
.mode{display:inline-flex;align-items:center;gap:8px;font-weight:700}.mode input{position:absolute;opacity:0}
.switch{position:relative;width:44px;height:26px;border-radius:999px;background:#ffffff33}.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.mode input:checked+.switch{background:var(--ok)}.mode input:checked+.switch::after{transform:translateX(18px)}
</style><script type="module" src="/admin/start/start.js?v=1"></script></head>
<body><header><span id="where"><i></i><span>位置を取得中…</span></span><a href="/admin/">地図・設定</a></header>
<button id="tap" class="way" type="button"><strong>位置だけ</strong><span id="sub">押すと、今の場所と時刻をすぐ残します</span></button>
<a class="way detail" href="/admin/record/"><strong>くわしく</strong><span>カテゴリ・金額・メモ・写真・評価を入力します</span></a>
<footer><label class="mode"><input id="visible" type="checkbox"><span class="switch" aria-hidden="true"></span><span id="visible-label">地図に非表示</span></label><div id="status" role="status" aria-live="polite" style="text-align:right">今日 <b id="count">0</b> 件</div><button id="undo" type="button" hidden>取り消す</button></footer>
</body></html>
