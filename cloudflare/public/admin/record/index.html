<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3efe6"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><title>記録する | TravelMap</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/admin/record/record.css?v=8"><link rel="stylesheet" href="/admin/record/flow.css?v=1"><script type="module" src="/admin/record/record.js?v=9"></script></head>
<body><form id="quick" autocomplete="off" novalidate>
<header class="top">
  <label class="when"><span id="when">--:--</span><input id="when-input" type="datetime-local" aria-label="記録する日時"></label>
  <button id="where" class="where" type="button" title="タップで位置を取り直す"><i aria-hidden="true"></i><span>位置を取得中…</span></button>
  <a class="back" href="/admin/start/">もどる</a>
</header>
<div id="auto-location-slot"></div>
<main class="card">
  <label class="block title-field"><span>タイトル（場所名）<small>任意</small></span><input id="place" class="place" maxlength="200" placeholder="どこで、なにをした？" aria-label="タイトル（場所名）" enterkeyhint="next"></label>
  <button id="title-next" class="flow-next" type="button">次へ：カテゴリ</button>
  <fieldset class="block categories"><legend>カテゴリ<em>必須</em></legend>
    <div class="quick-cats" id="quick-cats" role="radiogroup" aria-label="よく使うカテゴリ"></div>
    <button id="more" class="more" type="button" aria-haspopup="dialog" aria-expanded="false">ほか</button>
  </fieldset>
  <section class="block rating-block"><span class="flow-label">評価（任意）</span><div id="rating" class="stars" role="radiogroup" aria-label="評価"></div><button id="rating-skip" class="flow-next" type="button">写真へ進む</button></section>
  <section class="block photo-block"><span class="flow-label">カメラ・写真（任意）</span><div class="photos"><button id="photo-open" class="add-photo" type="button" aria-label="写真を追加">写真＋</button><input id="photo" type="file" accept="image/*" multiple hidden><div id="previews"></div></div><button id="photo-skip" class="flow-next" type="button">メモへ進む</button></section>
  <label class="block memo"><span class="flow-label">メモ（任意）</span><textarea id="memo" maxlength="4000" placeholder="なにがあった？" aria-label="メモ"></textarea></label>
  <button id="memo-done" class="flow-next" type="button">入力完了・保存内容を確認</button>
  <section class="block money" id="money">
    <label class="amount"><span class="yen">¥</span><input id="amount" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" placeholder="0" aria-label="金額（円）"></label>
    <div class="money-meta"><label class="expense" id="expense-field" hidden>支出の分類<select id="expense" aria-label="支出の分類"></select></label><span class="hint">空欄なら支払いなし</span></div>
  </section>
  <button class="block nopay" id="nopay" type="button" hidden>支払いなし <span>金額を入れる</span></button>
</main>
<footer class="bottom"><div class="bottom-meta"><label class="publish"><input id="publish" type="checkbox"><span class="switch" aria-hidden="true"></span><span id="publish-label">非公開</span></label><p id="message" role="status" aria-live="polite"></p></div><button id="save" type="submit">記録する</button></footer>
</form>
<div id="sheet" class="sheet" hidden><div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title">カテゴリを選ぶ</h2><button id="sheet-close" type="button" aria-label="閉じる">×</button></div><div id="sheet-list" class="sheet-list"></div></div></div>
<div id="done" class="done" hidden><canvas id="confetti"></canvas><div class="badge" role="status"><svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg><strong>記録しました</strong><span id="streak"></span></div></div>
</body></html>
