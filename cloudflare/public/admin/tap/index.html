<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#16362d"><meta name="mobile-web-app-capable" content="yes"><title>ワンタップ記録 | TravelMap</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon.svg">
<style>
:root{--bg:#16362d;--ink:#f3efe6;--muted:#a9c2b8;--ok:#7fe0b5;--warn:#f0b36a;font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;height:100dvh;padding:max(12px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
header{flex:none;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
header a{margin-left:auto;color:var(--muted);padding:8px 0}
#where i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--warn);margin-right:6px}#where.ok i{background:var(--ok)}
#tap{flex:1;margin:14px 0;border:0;border-radius:36px;background:radial-gradient(circle at 50% 40%,#2f7d63,#1f5c4a);color:#fff;font:inherit;font-size:clamp(34px,11vw,64px);font-weight:800;letter-spacing:.04em;box-shadow:0 18px 40px -18px #000c,inset 0 2px 0 #ffffff33;transition:transform .08s,filter .2s}
#tap:active{transform:scale(.97)}#tap.busy{filter:saturate(.4) brightness(.8)}#tap.done{background:radial-gradient(circle at 50% 40%,#f0b36a,#d98a2b)}
#tap small{display:block;margin-top:10px;font-size:15px;font-weight:600;opacity:.85;letter-spacing:0}
footer{flex:none;display:flex;align-items:center;gap:12px;min-height:52px;font-size:15px}
#status{flex:1}#status b{font-size:20px;font-variant-numeric:tabular-nums}
#undo{height:48px;padding:0 18px;border:1px solid #ffffff55;border-radius:16px;background:none;color:var(--ink);font:inherit;font-size:15px}
@media(prefers-reduced-motion:reduce){#tap{transition:none}}
</style><script type="module" src="/admin/tap/tap.js?v=2"></script></head>
<body><header><span id="where"><i></i><span>位置を取得中…</span></span><a href="/admin/start/">もどる</a></header>
<button id="tap" type="button">記録<small id="sub">今の場所と時刻を残す</small></button>
<footer><div id="status" role="status" aria-live="polite">今日 <b id="count">0</b> 件</div><button id="undo" type="button" hidden>取り消す</button></footer>
</body></html>
