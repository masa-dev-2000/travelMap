<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><title>TravelMap | みんなの旅の地図</title><link rel="stylesheet" href="/vendor/maplibre-gl.css"><link rel="stylesheet" href="/style.css"><link rel="manifest" href="/manifest.webmanifest"><script type="module" src="/app.js"></script></head>
<body><main>
<p id="message" role="status" aria-live="polite"></p>
<div id="map" aria-label="旅の地図"></div>
<div id="private-ui" hidden>
<div id="me-filters" class="row"><label>旅<select id="trip-filter"><option value="">すべて</option></select></label><button id="refresh">更新</button></div>
<details class="panel" id="money-panel"><summary>収支</summary><section><div class="row"><label>月<input id="month" type="month"></label></div><div id="summary" class="metrics"></div><p id="conversion-note"></p></section>
<details class="panel"><summary>取引を確認する</summary><div id="transactions" class="transactions"></div><button id="more-transactions" hidden>さらに読み込む</button></details>
</details>
<details class="panel"><summary>旅・分類を追加する</summary><form id="trip-form" class="form-grid"><label>旅の名前<input name="name" required maxlength="200"></label><label>開始日<input name="starts_on" type="date"></label><label>終了日<input name="ends_on" type="date"></label><button>旅を追加</button></form><form id="assign-form" class="form-grid"><h3 class="wide">期間の記録を旅にまとめる</h3><label>旅<select name="trip_id" required></select></label><label>開始日<input name="starts_on" type="date" required></label><label>終了日<input name="ends_on" type="date" required></label><button class="wide">この期間を旅に紐づける</button></form>
<form id="category-form" class="form-grid"><label>分類名<input name="name" required maxlength="200"></label><label>種類<select name="kind"><option value="activity">行動</option><option value="expense">支出</option><option value="income">収入</option></select></label><button>分類を追加</button></form></details>
<section><h2>行動の記録</h2><div id="activities" class="cards"></div><button id="more-activities" hidden>さらに読み込む</button></section>
<div id="add-forms"><details class="panel"><summary>行動を記録する</summary><form id="activity-form" class="form-grid">
<label>日時<input name="occurred_at" type="datetime-local" required></label><label>行動の分類<select name="category_id" required></select></label><label>旅<select name="trip_id"><option value="">日常・未設定</option></select></label><label>場所名<input name="observed_place_name" maxlength="200"></label>
<label class="wide">メモ<textarea name="memo" maxlength="4000" rows="3"></textarea></label><label>緯度<input name="latitude" type="number" step="any" min="-90" max="90"></label><label>経度<input name="longitude" type="number" step="any" min="-180" max="180"></label><button type="button" id="locate">現在地を入れる</button>
<label>評価<select name="rating"><option value="">未評価</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>支出額（円・空欄可）<input name="amount" type="number" min="0" step="1"></label><label>支出の分類<select name="expense_category"></select></label><button type="submit" class="primary">記録する</button></form></details>
<details class="panel"><summary>収入・支出・返金を記録する</summary><form id="transaction-form" class="form-grid">
<label>日時<input name="occurred_at" type="datetime-local" required></label><label>種別<select name="kind"><option value="expense">支出</option><option value="income">収入</option><option value="refund">返金</option></select></label><label>分類<select name="category_id" required></select></label><label>旅<select name="trip_id"><option value="">日常・未設定</option></select></label><label>通貨<select name="currency"><option>JPY</option><option>USD</option><option>EUR</option><option>KRW</option><option>TWD</option></select></label><label>原通貨の金額<input name="amount" type="number" min="0" step="any" required></label><label>円換算額（外貨のみ・空欄可）<input name="amount_jpy" type="number" min="0" step="1"></label><label>換算状態<select name="conversion_status"><option value="estimated">概算</option><option value="final">確定</option></select></label><label>返金元の取引ID<input name="refund_of"></label><label class="wide">説明<textarea name="description" maxlength="4000" rows="2"></textarea></label><button class="primary">保存する</button></form></details>
</div>
</div>
<dialog id="settings-dialog" aria-labelledby="settings-title"><div class="sheet-heading"><h2 id="settings-title">設定</h2><button id="close-settings" type="button" aria-label="設定を閉じる">×</button></div>
<section class="sheet-section travel-mode"><h3>旅モード</h3><label class="big-switch"><input id="map-visible" type="checkbox"><span class="switch" aria-hidden="true"></span><strong id="map-visible-label">旅モードオフ</strong></label><form id="status-form" class="status-form"><label for="status-input">いまのステータス</label><div class="row"><input id="status-input" name="status" maxlength="40" placeholder="例：阿蘇に向かってます" autocomplete="off" enterkeyhint="done"><button>更新</button></div></form><p class="hint">オンの間だけ、みんなの地図にあなたが表示されます。オフの間は、見せる設定にした記録も地図と一覧に出ません。</p>
<label>自動でオフにする<select id="map-visible-days"><option value="0">手動でオフにするまで</option><option value="3">3日後</option><option value="7">1週間後</option><option value="14">2週間後</option></select></label><p class="hint" id="map-visible-until"></p></section>
<section class="sheet-section"><h3>表示するユーザー</h3><div id="mute-settings"><p class="hint">読み込み中…</p></div></section>
<section class="sheet-section"><h3>地図の種類</h3><p class="hint">地図画面の種類変更はここから行います。</p><div id="map-style-settings"></div></section>
<section class="sheet-section"><h3>見せ方</h3><label class="check"><input id="publish-default" type="checkbox"> 新しい記録をみんなに見せる</label>
<div class="form-grid"><label>位置の出し方<select id="publish-precision"><option value="exact">そのまま（地図に点）</option><option value="city">場所名だけ（点は出さない）</option><option value="hidden">場所も位置も出さない</option></select></label><label>見せるまでの時間<select id="publish-delay"><option value="0">すぐ</option><option value="24">1日後</option><option value="72">3日後</option><option value="168">1週間後</option><option value="720">30日後</option></select></label></div>
<p class="hint">新しい記録の最初の状態です。記録ごとに変えられます。</p></section>
<section class="sheet-section" id="settings-panel"><h3>プロフィール</h3><div class="row account"><img id="me-avatar" alt="" hidden><div><strong id="me-name">…</strong><p class="hint" id="me-handle"></p></div></div>
<form id="profile-form" class="form-grid"><label>表示名<input name="display_name" maxlength="100" required></label><label>ハンドル（公開URL /u/…）<input name="handle" pattern="[a-z0-9][a-z0-9-]{1,23}" maxlength="24" required></label><div class="wide icon-field"><span>地図のアイコン画像（自分の最新地点に表示。正方形に切り抜かれます）</span><div class="row"><img id="icon-preview" alt="" width="56" height="56" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid #356f68" hidden><input id="icon-file" type="file" accept="image/*" aria-label="地図のアイコン画像"><button id="icon-remove" type="button" hidden>画像を外す</button></div></div><label>画像がないときの絵文字（1〜2文字・空ならGoogleの画像）<input name="icon" maxlength="8" placeholder="🚐" autocomplete="off"></label><label class="wide">ひとこと<textarea name="bio" rows="2" maxlength="300"></textarea></label><label class="wide">投げ銭リンク（https://…、任意）<input name="tip_url" type="url" maxlength="500" placeholder="https://"></label><button class="primary">プロフィールを保存</button></form>
<button id="logout" type="button">ログアウト</button><p class="hint"><a href="/terms">利用規約・プライバシー</a></p></section></dialog>
<dialog id="share-dialog"><form id="share-form" class="form-grid"><h2 class="wide">公開する内容を選ぶ</h2><input type="hidden" name="activity_id"><label>日付<input name="date" type="date" required></label><label>公開する場所名<input name="place_name" maxlength="200"></label><label class="wide">公開する文章<textarea name="memo" rows="4" maxlength="4000"></textarea></label><label>公開する緯度（任意）<input name="latitude" type="number" step="any" min="-90" max="90"></label><label>公開する経度（任意）<input name="longitude" type="number" step="any" min="-180" max="180"></label><fieldset id="share-photos" class="wide"><legend>公開するPNG写真</legend></fieldset><label class="wide check"><input name="confirmed" type="checkbox" required>この内容を誰でも見られるページに公開する</label><button class="primary">この内容で公開</button><button type="button" id="close-share">キャンセル</button><p id="share-error" role="alert" class="wide"></p></form></dialog>
</main></body></html>
