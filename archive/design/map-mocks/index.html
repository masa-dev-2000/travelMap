<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TravelMap — 地図UI 10案</title><link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="style.css"><script defer src="vendor/leaflet.js"></script><script type="module" src="app.js"></script></head>
<body>
<header class="comparison" aria-label="モック比較ツール">
  <div class="comparison-brand">TravelMap <span>UI STUDIES</span></div>
  <div class="choose"><button id="previous" title="前の案" aria-label="前の案">←</button><label class="sr-only" for="variant">デザイン案</label><select id="variant"></select><button id="next" title="次の案" aria-label="次の案">→</button></div>
  <div class="comparison-actions"><label class="sr-only" for="device">表示サイズ</label><select id="device"><option value="auto">画面に合わせる</option><option value="pc">PC</option><option value="sp">スマホ</option></select><label class="sr-only" for="audience">利用者</label><select id="audience"><option value="owner">本人用</option><option value="public">公開用</option></select><button id="reference-button">参考UI</button><button id="overview-button" title="10案の一覧">10案</button></div>
</header>
<main class="preview-area"><div id="frame" class="preview-frame"><section id="app" data-design="1" aria-label="TravelMap操作モック">
  <div id="map" aria-label="旅の記録の地図"></div>
  <div id="chrome"></div>
  <div id="map-controls" class="map-controls"><button id="fit-map" aria-label="記録全体を表示" title="記録全体を表示">⌖</button><button id="zoom-in" aria-label="地図を拡大">＋</button><button id="zoom-out" aria-label="地図を縮小">−</button></div>
  <div id="context-label" class="context-label"><span class="live-dot"></span>山陰の旅 <span>·</span> <span id="count-label"></span></div>
  <aside id="panel" class="content-panel" hidden aria-label="操作パネル"><div class="panel-heading"><div><span class="panel-kicker" id="panel-kicker">JOURNAL</span><h1 id="panel-title">記録</h1></div><button id="close-panel" aria-label="パネルを閉じる">×</button></div><div id="panel-body" class="panel-body"></div></aside>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div class="sample-label">SAMPLE DATA</div>
</section></div></main>
<dialog id="reference-dialog"><header><div><span class="eyebrow">REFERENCE</span><h2 id="reference-title"></h2></div><button id="close-reference" aria-label="参考UIを閉じる">×</button></header><div class="dialog-body"><p id="reference-description"></p><figure><img id="reference-image" alt="参考にした実サイトのUI"><figcaption id="reference-caption"></figcaption></figure><a id="reference-link" target="_blank" rel="noopener noreferrer">参考サイトを開く ↗</a><p class="fine">実サイトのUIを調査した参考画像です。操作・配置の着想をTravelMap向けに再構成しています。</p></div></dialog>
<dialog id="overview-dialog"><header><div><span class="eyebrow">10 MAP EXPERIENCES</span><h2>どの地図が、しっくりくる？</h2></div><button id="close-overview" aria-label="一覧を閉じる">×</button></header><div id="overview" class="dialog-body overview-grid"></div></dialog>
</body></html>
