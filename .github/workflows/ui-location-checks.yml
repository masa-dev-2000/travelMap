name: UI and private location checks
on:
  pull_request:
    paths: ['cloudflare/**', 'data_model/**', 'CODEMAP.md', 'docs/issues-2-7-implementation.md', '.github/workflows/ui-location-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-location-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: cloudflare
      - run: npm run check && npm test && npm run build
        working-directory: cloudflare
      - run: python cloudflare/tests/check-location-migration.py
      - run: python cloudflare/tests/check-location-indexes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: location-core-evidence
          path: test-artifacts/
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && node scripts/prepare-assets.mjs
        working-directory: cloudflare
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python cloudflare/tests/browser-smoke.py
      - name: Real MapLibre/WebGL smoke (synthetic map style and data)
        if: always()
        run: python cloudflare/tests/browser-real-map.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-location-test-artifacts
          path: test-artifacts/
          if-no-files-found: ignore
