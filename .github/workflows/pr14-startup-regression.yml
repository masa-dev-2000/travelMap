name: PR14 first-play initialization repair
on:
  push:
    branches: [feat/issues-9-13-map-social-playback]
    paths: [.github/workflows/pr14-startup-regression.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'masa-dev-2000/travelMap' && github.ref == 'refs/heads/feat/issues-9-13-map-social-playback'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source versions and apply the bounded regression
        run: |
          python - <<'PY'
          import pathlib,hashlib,subprocess
          bases={'cloudflare/public/panel-me.js':'77360063e43fa9c6625af71a443424fc943cdb87','cloudflare/tests/browser-smoke.py':'94b6e56e5ca5407b0093ff2f798fb259ae344d03','cloudflare/tests/browser-real-map.py':'d43a527e4c993bf02662be0baea02feec9b4d5b0'}
          data={}
          for name,sha in bases.items():
              p=pathlib.Path(name);assert not p.is_symlink();b=p.read_bytes()
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha,'Concurrent change: '+name
              data[name]=b.decode()
          name='cloudflare/public/panel-me.js';s=data[name]
          old='async function refresh(){await Promise.all([summary(),activities(),transactions()]);everyone.reload();}'
          assert s.count(old)==1
          s=s.replace(old,'async function refresh(){await Promise.all([summary(),activities(),transactions()]);await everyone.reload();}')
          old='try{await bootstrap();await refresh();}catch(error){notify(error.message);}'
          assert s.count(old)==1
          s=s.replace(old,"// app.js has already loaded the viewer feed. A redundant startup reload could\n// cancel the user's first playback request while private panels finish loading.\ntry{await bootstrap();await Promise.all([summary(),activities(),transactions()]);}catch(error){notify(error.message);}")
          data[name]=s
          name='cloudflare/tests/browser-smoke.py';s=data[name]
          test="""    def test_play_during_profile_bootstrap(self):
                  # Deliberately interleave private-panel startup and the first Play fetch.
                  # No forced clicks or longer global timeout: reproduce the cancellation.
                  p=self.page;activities=[];feeds=[];feed_calls=[]
                  def hold(route):
                      path=urlparse(route.request.url).path
                      if path=='/api/private/activities':activities.append(route);return
                      if path=='/api/private/viewer-feed':
                          feed_calls.append(route.request.url)
                          if len(feed_calls)==2:feeds.append(route);return
                      self.api(route)
                  p.route('**/api/**',hold);p.goto(self.origin+'/')
                  expect(p.locator('.stories-strip')).to_be_visible()
                  for _ in range(100):
                      if activities:break
                      p.wait_for_timeout(20)
                  self.assertTrue(activities)
                  p.evaluate('void __tm.playback.play()')
                  for _ in range(100):
                      if feeds:break
                      p.wait_for_timeout(20)
                  self.assertTrue(feeds)
                  self.api(activities.pop())
                  expect(p.locator('.auto-location')).to_be_visible()
                  self.assertEqual(len(feed_calls),2,'Private startup must not replace the pending Play feed')
                  self.api(feeds.pop());p.wait_for_function('__tm.player.active()')
                  self.assertEqual(p.evaluate('__tm.player.state().author'),'friend')
          """
          # Embedded lines carry eight extra spaces after the first line.
          test='\n'.join(line[8:] if i and line.startswith('        ') else line for i,line in enumerate(test.split('\n')))
          marker="if __name__=='__main__':unittest.main(verbosity=2)"
          assert s.count(marker)==1 and 'def test_play_during_profile_bootstrap' not in s
          data[name]=s.replace(marker,test+marker)
          name='cloudflare/tests/browser-real-map.py';s=data[name];old="'BrowserTests.test_self_shared_url_stays_public_only'";assert s.count(old)==1
          data[name]=s.replace(old,old+",'BrowserTests.test_play_during_profile_bootstrap'")
          for name,s in data.items():pathlib.Path(name).write_text(s)
          subprocess.run(['python','-m','py_compile','cloudflare/tests/browser-smoke.py','cloudflare/tests/browser-real-map.py'],check=True)
          subprocess.run(['git','add','--',*bases],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: Fast-forward only the PR branch
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          REF='refs/heads/feat/issues-9-13-map-social-playback'
          test "$(git -c "http.https://github.com/.extraheader=$AUTH" ls-remote origin "$REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: avoid duplicate startup feed cancelling first playback'
          git -c "http.https://github.com/.extraheader=$AUTH" push origin "HEAD:$REF"
