name: Verify and apply PR14 fixes
on:
  push:
    branches: [feat/issues-9-13-map-social-playback]
    paths: ['.github/workflows/pr14-verified-repair.yml']
permissions:
  contents: read
concurrency:
  group: pr14-verified-repair
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'masa-dev-2000/travelMap' && github.ref == 'refs/heads/feat/issues-9-13-map-social-playback'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate every source and result blob before applying text edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          shas=['47daca08dd026dfd2f4157a50ed4c436707cb9e2','33d1dd8a75cf41303a0364605e6d5cc65f9d7140','e7e4693329e66115d0130aec00cb3914d6c3a2fa','db2c1ed8e6dfe32bf52437a45d87ac65117de92d']
          blob=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          pieces=[]
          for sha in shas:
              req=urllib.request.Request('https://api.github.com/repos/masa-dev-2000/travelMap/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response: item=json.load(response)
              assert item['encoding']=='base64'
              piece=base64.b64decode(item['content']);assert blob(piece)==sha
              pieces.append(piece)
          compressed=base64.b64decode(b''.join(pieces),validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='58bd3514008278609194be6006b5a857c1d60ab07a54f2b7ae66ed8df6cdc7c5'
          manifest=json.loads(lzma.decompress(compressed));assert manifest['base']=='02cd2f35456042eba282d67b24033b4c399fa7ac'
          subprocess.run(['git','merge-base','--is-ancestor',manifest['base'],'HEAD'],check=True)
          root=Path.cwd();changes=[]
          for name,entry in manifest['files'].items():
              path=PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name.startswith(('cloudflare/','docs/','.github/workflows/')) or name in ('.gitignore','CODEMAP.md')
              target=root/name;assert not target.is_symlink()
              previous=target.read_bytes() if target.exists() else None
              assert (blob(previous) if previous is not None else None)==entry['old'], 'Concurrent source change: '+name
              if entry['delete']:
                  changes.append((name,None));continue
              if 'text' in entry: result=entry['text'].encode()
              else:
                  lines=previous.decode().splitlines(keepends=True)
                  for start,end,text in reversed(entry['edits']):
                      assert 0<=start<=end<=len(lines)
                      lines[start:end]=[text]
                  result=''.join(lines).encode()
              assert blob(result)==entry['sha'], 'Result mismatch: '+name
              changes.append((name,result))
          for name,result in changes:
              target=root/name
              if result is None: target.unlink()
              else:
                  target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(result)
          subprocess.run(['git','add','-A','--',*manifest['files']],check=True)
          subprocess.run(['git','rm','--','.github/workflows/pr14-verified-repair.yml'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('Verified',len(changes),'source changes. No production operations.')
          PY
      - id: commit
        name: Fast-forward only the existing Draft PR branch
        run: |
          set -euo pipefail
          branch=feat/issues-9-13-map-social-playback
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$GITHUB_SHA" || { echo 'Concurrent branch update; refusing overwrite'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: integrate PR14 unread playback, mute and map navigation'
          git push origin "HEAD:refs/heads/$branch"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  core:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: cloudflare
      - run: npm run check && npm test && npm run build
        working-directory: cloudflare
      - name: Migration integration
        if: always()
        run: python cloudflare/tests/check-location-migration.py
      - name: Index and paging regression
        if: always()
        run: python cloudflare/tests/check-location-indexes.py
      - name: Record tested revision
        if: always()
        run: mkdir -p test-artifacts && git rev-parse HEAD > test-artifacts/revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr14-repair-core
          path: test-artifacts/
  browser:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && node scripts/prepare-assets.mjs
        working-directory: cloudflare
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python cloudflare/tests/browser-smoke.py
      - name: Real MapLibre and WebGL regression
        if: always()
        run: python cloudflare/tests/browser-real-map.py
      - name: Record tested revision
        if: always()
        run: mkdir -p test-artifacts && git rev-parse HEAD > test-artifacts/revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr14-repair-browser
          path: test-artifacts/
