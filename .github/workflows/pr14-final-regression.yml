name: PR14 bounded final regressions
on:
  push:
    branches: [feat/issues-9-13-map-social-playback]
    paths: [.github/workflows/pr14-final-regression.yml]
permissions:
  contents: write
concurrency:
  group: pr14-final-regressions
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'masa-dev-2000/travelMap' && github.ref == 'refs/heads/feat/issues-9-13-map-social-playback'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate all six existing sources and replacement checksums before editing
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          sha='2b483c7f6be0900b2e690703d1da5877f6d44042'
          req=urllib.request.Request('https://api.github.com/repos/masa-dev-2000/travelMap/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['READ_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response: obj=json.load(response)
          data=base64.b64decode(obj['content'])
          assert hashlib.sha256(data).hexdigest()=='ee1bef2fe2de825087f9c115a577bbd3348676436f38bb8d361323bf731dfe09'
          bundle=json.loads(lzma.decompress(data));assert bundle['base']=='c1d8639dd191dfe12d35a50a1ff08c8656f4f87d'
          allowed={'cloudflare/public/app.js','cloudflare/public/map-record-card.js','cloudflare/public/playback-controller.js','cloudflare/tests/viewer-state.test.ts','cloudflare/tests/browser-smoke.py','cloudflare/tests/browser-real-map.py'}
          assert len(bundle['files'])==6 and {f['p'] for f in bundle['files']}==allowed
          root=pathlib.Path.cwd();pending=[]
          for f in bundle['files']:
              target=root/f['p'];assert not target.is_symlink() and root in target.resolve().parents
              old=target.read_bytes();blob=hashlib.sha1(b'blob '+str(len(old)).encode()+b'\0'+old).hexdigest()
              assert blob==f['b'],'Concurrent change; refusing overwrite: '+f['p']
              lines=old.decode().splitlines(keepends=True)
              for start,end,text in reversed(f['edits']):
                  assert 0<=start<=end<=len(lines)
                  lines[start:end]=text.splitlines(keepends=True)
              new=''.join(lines).encode();assert hashlib.sha256(new).hexdigest()==f['a']
              pending.append((target,new))
          for target,new in pending:target.write_bytes(new)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('Six source patches validated. No workflow, main, or production changes.')
          PY
      - name: Fast-forward only the existing PR branch
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          REF='refs/heads/feat/issues-9-13-map-social-playback'
          CURRENT=$(git -c "http.https://github.com/.extraheader=$AUTH" ls-remote origin "$REF" | cut -f1)
          test "$CURRENT" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: cancel hidden playback loads and preserve public-only self sharing'
          git -c "http.https://github.com/.extraheader=$AUTH" push origin "HEAD:$REF"
          mkdir -p /tmp/pr14-final-receipt
          git rev-parse HEAD > /tmp/pr14-final-receipt/commit.txt
          git diff HEAD^ HEAD --stat > /tmp/pr14-final-receipt/changes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr14-final-apply-receipt
          path: /tmp/pr14-final-receipt/
          retention-days: 1
