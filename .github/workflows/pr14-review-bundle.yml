name: PR14 isolated review bundle
on:
  push:
    branches: [feat/issues-9-13-map-social-playback]
    paths: [.github/workflows/pr14-review-bundle.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Snapshot source for three-way reconciliation; no credentials
        run: |
          mkdir -p /tmp/pr14-review-bundle
          git archive --format=tar HEAD | gzip > /tmp/pr14-review-bundle/source.tar.gz
          git rev-parse HEAD > /tmp/pr14-review-bundle/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr14-reconciliation-source
          path: /tmp/pr14-review-bundle/
          retention-days: 1
