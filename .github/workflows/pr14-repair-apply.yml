name: Apply verified PR14 repairs
on:
  push:
    branches: [feat/issues-9-13-map-social-playback]
    paths: [.github/workflows/pr14-repair-apply.yml]
permissions:
  contents: write
concurrency:
  group: pr14-verified-repair-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'masa-dev-2000/travelMap' && github.ref == 'refs/heads/feat/issues-9-13-map-social-playback'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate every original and replacement before modifying files
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          root=pathlib.Path.cwd()
          parts=[pathlib.Path(f'scripts/pr14-transfer/part-{i}.b64') for i in range(7)]
          data=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          digest='9e31e7cb031a85f317bc16d860a5d989fc66507c8ba077add5dcc00f8fa39e10'
          assert hashlib.sha256(data).hexdigest()==digest, 'Repair bundle checksum differs'
          bundle=json.loads(lzma.decompress(data))
          assert bundle['base_commit']=='02cd2f35456042eba282d67b24033b4c399fa7ac'
          special={'.gitignore','CODEMAP.md','.github/workflows/ui-location-checks.yml','.github/workflows/pr14-review-bundle.yml'}
          pending=[];seen=set()
          for f in bundle['files']:
              path=pathlib.PurePosixPath(f['p'])
              assert not path.is_absolute() and '..' not in path.parts and f['p'] not in seen
              assert f['p'] in special or f['p'].startswith(('cloudflare/','docs/'))
              seen.add(f['p']);target=root.joinpath(path)
              assert not target.is_symlink() and root in target.resolve().parents
              for parent in target.parents:
                  assert not parent.is_symlink()
                  if parent==root:break
              if f['b'] is None:
                  assert not target.exists(), f'New file already exists: {path}'
                  new=f['text'].encode('utf-8')
              else:
                  old=target.read_bytes()
                  blob=hashlib.sha1(b'blob '+str(len(old)).encode()+b'\0'+old).hexdigest()
                  assert blob==f['b'], f'Concurrent change at {path}; refusing overwrite'
                  if f['a'] is None:new=None
                  else:
                      lines=old.decode('utf-8').splitlines(keepends=True)
                      for start,end,text in reversed(f['edits']):
                          assert 0<=start<=end<=len(lines)
                          lines[start:end]=text.splitlines(keepends=True)
                      new=''.join(lines).encode('utf-8')
              assert new is None or hashlib.sha256(new).hexdigest()==f['a'], f'Replacement checksum differs: {path}'
              pending.append((target,new))
          assert len(pending)==38
          for target,new in pending:
              if new is None:target.unlink()
              else:target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(new)
          apply_path=pathlib.Path('.github/workflows/pr14-repair-apply.yml')
          for p in [*parts,apply_path]:p.unlink()
          paths=[f['p'] for f in bundle['files']]+[str(p) for p in parts]+[str(apply_path)]
          subprocess.run(['git','add','-A','--',*paths],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert set(changed)<=set(paths)
          receipt={'source_head':os.environ['GITHUB_SHA'],'reviewed_base':bundle['base_commit'],'bundle_sha256':digest,'files':[{k:f[k] for k in ('p','b','a')} for f in bundle['files']],'temporary_files_removed':True}
          pathlib.Path('/tmp/pr14-apply-receipt.json').write_text(json.dumps(receipt,indent=2))
          print(f'Validated and staged {len(pending)} source repairs; temporary transfer files removed')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete reviewed map social playback and regressions'
      - name: Fast-forward only the existing PR branch
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          REF='refs/heads/feat/issues-9-13-map-social-playback'
          CURRENT=$(git -c "http.https://github.com/.extraheader=$AUTH" ls-remote origin "$REF" | cut -f1)
          test "$CURRENT" = "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=$AUTH" push origin "HEAD:$REF"
          python - <<'PY'
          import json,pathlib,subprocess
          p=pathlib.Path('/tmp/pr14-apply-receipt.json');r=json.loads(p.read_text())
          r['repair_commit']=subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          r['pushed']=True;p.write_text(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr14-repair-apply-receipt
          path: /tmp/pr14-apply-receipt.json
          retention-days: 3
          if-no-files-found: ignore
