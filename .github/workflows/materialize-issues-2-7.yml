name: Materialize reviewed issue 2-7 source changes
on:
  push:
    branches: [feat/issues-2-7-mobile-map-20260920]
    paths: ['.github/implementation-2-7/**', '.github/workflows/materialize-issues-2-7.yml']
permissions:
  contents: write
concurrency:
  group: materialize-issues-2-7
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'masa-dev-2000/travelMap' && github.ref == 'refs/heads/feat/issues-2-7-mobile-map-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issues-2-7-mobile-map-20260920
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify transport and unpack reviewed source
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess
          root=pathlib.Path('.')
          parts=sorted(root.glob('.github/implementation-2-7/part-*.txt'))
          assert len(parts)==13, 'Incomplete transport'
          packed=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='e5d0f4810ec83b0a8581b9cf5d9fff70234305968ffd0c8fe2772cd1e9034e4e', 'Transport checksum mismatch'
          data=json.loads(gzip.decompress(packed))
          assert len(data)==21
          for name,content in data.items():
              path=pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert name.startswith('cloudflare/') or name in ['scripts/implement-issues-2-7.py','docs/issues-2-7-implementation.md','.github/workflows/ui-location-checks.yml']
              target=root/name
              if name=='.github/workflows/ui-location-checks.yml':
                  assert target.read_text()==content, 'CI file must match connector-installed source'
                  continue
              if target.exists():
                  assert name=='cloudflare/public/replay.js', 'Refusing to overwrite unexpected existing file: '+name
                  raw=target.read_bytes()
                  assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='0be74709dc1be498dbc239dbdfa261f415fbf8d4', 'Replay base changed'
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(content,encoding='utf-8')
          subprocess.run(['python','scripts/implement-issues-2-7.py'],check=True)
          PY
      - name: Check source syntax and standalone tests
        run: |
          find cloudflare/public -name '*.js' -not -path '*/vendor/*' -print0 | xargs -0 -n1 node --check
          cd cloudflare
          node --experimental-strip-types --test tests/location-api.test.ts tests/ux-state.test.ts
          python tests/check-location-migration.py
      - name: Commit source to the feature branch only
        shell: bash
        run: |
          rm scripts/implement-issues-2-7.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare docs/issues-2-7-implementation.md
          git diff --cached --check
          git commit -m 'Implement mobile input, map cards, replay and private location capture (issues 2-7)'
          git push origin HEAD:feat/issues-2-7-mobile-map-20260920
